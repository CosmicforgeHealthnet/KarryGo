# notification-service: adopts the container that already runs on the server.
# Its database and Redis containers keep running untouched; the settings file
# points at them by container name.
name: karrygo-notification-service

services:
  app:
    extends:
      file: common.yml
      service: go-service
    image: ${IMAGE:?IMAGE must name an immutable image (set by deploy-service.sh)}
    container_name: karrygo-notification-service
    env_file:
      - /opt/karrygo/notification-service/notification.service.env
    environment:
      # Push notifications (Firebase Cloud Messaging). The service account file
      # is copied to the server by hand and never committed; see the guide,
      # "Push notifications". Push is only switched on when this path and
      # FIREBASE_PROJECT_ID (in the settings file) are both set.
      GOOGLE_APPLICATION_CREDENTIALS: /run/firebase/service-account.json
    volumes:
      # Read-only. Mode 644 so the container user can read it; /opt/karrygo is
      # deploy-only (750), so no other account on the server can reach it.
      - /opt/karrygo/notification-service/firebase-service-account.json:/run/firebase/service-account.json:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8106/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  karrygo-net:
    external: true
