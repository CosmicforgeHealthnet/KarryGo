# payment-wallet-service: adopts the container that already runs on the server.
# Its database and Redis containers keep running untouched; the settings file
# points at them by container name.
name: karrygo-payment-wallet-service

services:
  app:
    extends:
      file: common.yml
      service: go-service
    image: ${IMAGE:?IMAGE must name an immutable image (set by deploy-service.sh)}
    container_name: karrygo-payment-wallet-service
    env_file:
      - /opt/karrygo/payment-wallet-service/wallet.env

    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8105/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  karrygo-net:
    external: true
