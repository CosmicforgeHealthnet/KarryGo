# pricing-service: a new service with its own database.
# Database passwords live in /opt/karrygo/pricing-service/db.env (see deploy/platform/env/).
name: karrygo-pricing-service

services:
  app:
    extends:
      file: common.yml
      service: go-service
    image: ${IMAGE:?IMAGE must name an immutable image (set by deploy-service.sh)}
    container_name: karrygo-pricing-service
    env_file:
      - /opt/karrygo/pricing-service/pricing.env
    depends_on:
      db:
        condition: service_healthy
    # Reachable only from the server itself (for checks); the apps reach it
    # through the api-gateway on the private network.
    ports:
      - "127.0.0.1:8115:8115"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8115/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # This service's own PostgreSQL database. Only reachable on the private network.
  db:
    extends:
      file: common.yml
      service: postgres
    container_name: karrygo-pricing-db
    env_file:
      - /opt/karrygo/pricing-service/db.env
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 256m

networks:
  karrygo-net:
    external: true

volumes:
  # Named explicitly so the data folder is easy to find and back up.
  db-data:
    name: karrygo-pricing-db-data
