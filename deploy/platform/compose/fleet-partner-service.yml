# fleet-partner-service: the API plus its background worker (same image).
# Adopts the containers that already run on the server; the fleet database and
# Redis containers keep running untouched.
name: karrygo-fleet-partner-service

services:
  app:
    extends:
      file: common.yml
      service: go-service
    image: ${IMAGE:?IMAGE must name an immutable image (set by deploy-service.sh)}
    container_name: karrygo-fleet-partner-api
    env_file:
      - /opt/karrygo/fleet-partner-service/fleet.service.env
    # Reachable only from the server itself (nginx: fleet-api.staging.karryam.com).
    ports:
      - "127.0.0.1:8113:8113"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8113/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Background jobs (exports, imports, finance). It serves no web traffic, so it
  # publishes no port and has no web health check.
  worker:
    extends:
      file: common.yml
      service: go-service
    image: ${IMAGE:?IMAGE must name an immutable image (set by deploy-service.sh)}
    container_name: karrygo-fleet-partner-worker
    entrypoint: ["/bin/fleet-partner-worker"]
    env_file:
      - /opt/karrygo/fleet-partner-service/fleet.service.env
    mem_limit: 384m

networks:
  karrygo-net:
    external: true
