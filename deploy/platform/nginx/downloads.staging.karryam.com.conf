# nginx site for downloads.staging.karryam.com (public driver app downloads).
#
# Installed by hand, not by CI (see the guide, section V):
#   sudo mkdir -p /var/www/karryam-downloads
#   sudo cp /opt/karrygo/platform/nginx/downloads.staging.karryam.com.conf \
#           /etc/nginx/sites-available/downloads.staging.karryam.com
#   sudo ln -s /etc/nginx/sites-available/downloads.staging.karryam.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d downloads.staging.karryam.com
#
# Only .apk files and their .sha256 checksums are served; everything else is 404.

server {
    listen 80;
    listen [::]:80;
    server_name downloads.staging.karryam.com;

    root /var/www/karryam-downloads;
    autoindex off;
    server_tokens off;

    location ~ ^/[A-Za-z0-9._-]+\.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/[A-Za-z0-9._-]+\.apk\.sha256$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
