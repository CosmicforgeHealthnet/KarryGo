# nginx site for api-gateway.staging.karryam.com (the address the mobile apps use).
#
# Installed by hand, not by CI (see the guide, section M):
#   sudo cp /etc/nginx/sites-available/api-gateway.staging.karryam.com{,.bak-$(date +%F)}
#   sudo cp /opt/karrygo/platform/nginx/api-gateway.staging.karryam.com.conf \
#           /etc/nginx/sites-available/api-gateway.staging.karryam.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# It keeps the server's existing HTTPS (certbot) lines and adds the stricter
# rules from deploy/customer-public-ingress.locations.conf, adapted to this
# server's ports: api-gateway on 127.0.0.1:4100, media-file-service on 127.0.0.1:4101.
#
# Rule order matters: nginx checks the "~" (pattern) locations in the order
# written, so the blocking rules come first.

server {
    server_name api-gateway.staging.karryam.com;
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # --- Never public -----------------------------------------------------
    # Section 20: the admin bridge and every service-to-service namespace are
    # never served on the public host. Case-insensitive; nginx matches the
    # decoded, slash-merged URI, and the gateway re-checks every encoding layer.
    location ~* ^/api/v1/admin(/|$) { return 404; }
    location ~* ^/internal(/|$) { return 404; }
    # Service-to-service pages, ANYWHERE in the address (the old rule only
    # caught addresses that started with /internal), and "../" tricks.
    location ~* (^|/)(internal|\.\.)(/|$) { return 404; }
    # Admin-only support pages and the verification service.
    location ~* ^/api/v1/(support-disputes/admin|verification-compliance)(/|$) { return 404; }
    # Internal statistics pages (some have no login at all).
    location ~* ^/api/v1/[^/]+/(metrics|outbox-metrics)/?$ { return 404; }

    # --- Live updates (websocket) ----------------------------------------
    location = /api/v1/notifications/ws {
        access_log off;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    # The rest of /api/v1/notifications/ is service-to-service only.
    location /api/v1/notifications/ { return 404; }

    # --- "Share my trip" links: no logging, no caching, no referrer ------
    location ~ ^/api/v1/customer/public/journey-shares/[^/]+$ {
        access_log off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:4100;
    }

    # --- Media: only the short-lived customer upload operation ------------
    location ~ ^/api/v1/media-files/customer-uploads/[^/]+/content$ {
        limit_except POST { deny all; }
        access_log off;
        proxy_pass http://127.0.0.1:4101;
    }
    location ~ ^/api/v1/media-files/vendor-uploads/[^/]+/content$ {
        limit_except POST { deny all; }
        access_log off;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:4101;
    }
    location /api/v1/media-files/ { return 404; }

    # --- Everything else the apps use goes through the api-gateway --------
    location = /health { proxy_pass http://127.0.0.1:4100; }
    location /api/v1/ { proxy_pass http://127.0.0.1:4100; }
    location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api-gateway.staging.karryam.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api-gateway.staging.karryam.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api-gateway.staging.karryam.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api-gateway.staging.karryam.com;
    return 404; # managed by Certbot
}
