# Customer V4 §20. Include inside the EXISTING TLS virtual host after replacing
# loopback ports with the operator's private upstreams. Do not publish service
# listeners or install a second gateway. No raw URI/query/referrer access logs.
# Regex locations MUST precede other regex locations in that virtual host.
# Section 20: the admin bridge (admin-backoffice-service, private listener
# only) and every service-to-service namespace are never public. These denies
# mirror deploy/platform/nginx/api-gateway.staging.karryam.com.conf and must
# stay ahead of every proxy_pass location below.
location ~* ^/api/v1/admin(/|$) { return 404; }
location ~* ^/internal(/|$) { return 404; }
location ~* (^|/)(internal|\.\.)(/|$) { return 404; }
location ~* ^/api/v1/(support-disputes/admin|verification-compliance)(/|$) { return 404; }
# Operational scrape endpoints are network-placed, never public (Taxi's has no auth).
location ~* ^/api/v1/[^/]+/(metrics|outbox-metrics)/?$ { return 404; }

# Notification HTTP APIs are HMAC-only despite their public-looking prefix.
location = /api/v1/notifications/ws {
    access_log off;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
location /api/v1/notifications/ { return 404; }

# Opaque Share capability: no bearer requirement, no URI-bearing access log,
# no referrer, and no proxy cache. The owning application enforces rate limits.
location ~ ^/api/v1/customer/public/journey-shares/[^/]+$ {
    access_log off;
    error_log /dev/null;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:8080;
}

# Vendor's established direct ingress; ordinary prefixes (never ^~) allow the
# deny regex above to intercept nested /internal/ paths.
location /api/v1/vendor/ { proxy_pass http://127.0.0.1:8112; }
location /api/v1/commerce/ { proxy_pass http://127.0.0.1:8112; }

# Media exposes only the short-lived capability redemption operation.
location ~ ^/api/v1/media-files/customer-uploads/[^/]+/content$ {
    limit_except POST { deny all; }
    access_log off;
    proxy_pass http://127.0.0.1:8109;
}
location ~ ^/api/v1/media-files/vendor-uploads/[^/]+/content$ {
    limit_except POST { deny all; }
    access_log off;
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:8109;
}
location /api/v1/media-files/ { return 404; }

# Established customer/provider route families retain their owning auth.
location /api/v1/customer/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/taxi/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/hauling/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/dispatch/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/provider/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/auth/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/payment-wallet/ { proxy_pass http://127.0.0.1:8080; }
location /api/v1/support-disputes/ { proxy_pass http://127.0.0.1:8080; }
location / { return 404; }
