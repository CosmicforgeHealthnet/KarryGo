name: Deploy api-gateway

on:
  push:
    branches:
      - staging
    paths:
      - 'services/api-gateway/**'
      - 'services/Dockerfile'
      - 'shared/go/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        # The commit is stamped into the binary so a deployed service can be
        # asked which commit it is running (OPS-002). The image tag alone
        # cannot answer that: :latest is reused by every build.
        run: |
          docker build -f services/Dockerfile --build-arg SERVICE_DIR=api-gateway \
            --build-arg BUILD_COMMIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_VERSION="${{ github.ref_name }}-${{ github.run_number }}" \
            -t ghcr.io/cosmicforgehealthnet/api-gateway:latest .

      - name: Push the image
        run: docker push ghcr.io/cosmicforgehealthnet/api-gateway:latest

      - name: Deploy on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/karrygo/api-gateway
            docker-compose pull
            docker-compose up -d