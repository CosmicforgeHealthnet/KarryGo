name: Vendor Sections 46-48 gates

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Reviewed comparison commit SHA (the stacked PR base)'
        required: true
        type: string
  pull_request:
  push:
    branches: [staging, codex/staging-secure-admin-integration-20261020]

permissions:
  contents: read

jobs:
  vendor-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: karrygo_test, POSTGRES_PASSWORD: karrygo_test, POSTGRES_DB: vendor_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U karrygo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOFLAGS: -buildvcs=false
      VENDOR_TEST_DATABASE_URL: postgres://karrygo_test:karrygo_test@127.0.0.1:5432/vendor_test?sslmode=disable
      VENDOR_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.9', cache: true}
      - name: No frontend application implementation changes
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          COMPARISON_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        shell: bash
        run: |
          [[ "$COMPARISON_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git diff --name-only "$COMPARISON_BASE_SHA" HEAD -- \
            'apps/**' 'web/**' 'frontend/**' 'mobile/**' \
            ':!apps/dispatch_provider/test/**' > "$RUNNER_TEMP/frontend-changes.txt"
          # Sections 6-10 explicitly includes repairing Dispatch contract tests.
          # Runtime app, web, assets and all other frontend changes still fail.
          test ! -s "$RUNNER_TEMP/frontend-changes.txt"
      - name: Formatting and whitespace
        env:
          COMPARISON_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        shell: bash
        run: |
          base="$COMPARISON_BASE_SHA"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.go' > "$RUNNER_TEMP/changed-go.txt"
          if [ -s "$RUNNER_TEMP/changed-go.txt" ]; then
            test -z "$(xargs -r gofmt -l < "$RUNNER_TEMP/changed-go.txt")"
          fi
          git diff --check
      - name: Configuration, topology, route, event and worker contracts
        working-directory: services/vendor-service
        run: go test ./internal/config ./internal/operational ./internal/crmcontract ./internal/events ./internal/jobs -count=1 -p 1 -timeout=600s
      - name: VPS deployment bundle
        env:
          VENDOR_IMAGE: ghcr.io/cosmicforgehealthnet/vendor-service:ci-validation
          VENDOR_ENV_FILE: ${{ github.workspace }}/deploy/vendor-service/vendor.env.example
        run: |
          docker compose -f deploy/vendor-service/docker-compose.staging.yml config --quiet
          docker build -f services/vendor-service/Dockerfile -t "$VENDOR_IMAGE" .
      - name: Vendor tests
        working-directory: services/vendor-service
        run: go test ./... -count=1 -p 1 -timeout=1200s
      - name: Vet and build
        working-directory: services/vendor-service
        run: go vet ./... && go build ./...
      - name: Secret and credential guards
        shell: bash
        run: |
          ! git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|sk-proj-[A-Za-z0-9_-]{20,}' -- services/vendor-service shared/go
          test -z "$(git ls-files --others --exclude-standard | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.env\.(example|sample|template)$' || true)"
          test -z "$(git grep -n -I -E 'log\.(Print|Printf|Info|Debug).*([Oo][Tt][Pp]|[Qq][Rr]|[Tt]oken|[Pp]assword|[Ss]ecret)' -- 'services/vendor-service/**' 'shared/go/**' ':(exclude)**/*_test.go' || true)"
