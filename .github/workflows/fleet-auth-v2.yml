name: Fleet authentication v2
on:
  push:
    branches: [staging]
    paths:
      - services/fleet-partner-service/**
      - web/fleet/**
      - .github/workflows/fleet-auth-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_auth_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FLEET_PARTNER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fleet_auth_v2_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: services/fleet-partner-service/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/fleet/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web/fleet
      - run: npx playwright install --only-shell chromium
        working-directory: web/fleet
      - name: Auth security and contracts
        run: go test ./services/fleet-partner-service/internal/features/auth/... ./services/fleet-partner-service/internal/platform/contact/... ./services/fleet-partner-service/internal/section28contract/...
      - name: Real PostgreSQL auth and organization regression
        run: go test ./services/fleet-partner-service/internal/integration -run 'TestAuth|TestPasswordless|TestBothEmail|TestOTP|TestIncorrectOTP|TestExpiredAndConsumed|TestResendCooldown|TestConcurrentVerification|TestIdentityPairConflict|TestStartIsEnumerationSafe|TestRefresh|TestLogout|TestSuspendedIdentity|TestMultipleMemberships|TestSingleMembership|TestSuspendedOrganization|TestStepUp|TestRateLimit|TestChallengeExpiry|TestOrganization|TestOnboarding|TestInvitation|TestStaff' -count=1 -v
      - name: Frontend tests and build
        working-directory: web/fleet
        run: |
          npm test
          npm run build
          npm run typecheck
          npx eslint 'src/components/features/auth/*.tsx' src/lib/hooks/useContactAuthForm.ts src/lib/services/authService.ts src/lib/api/client.ts src/lib/auth/authErrors.ts 'src/app/(auth)/sign-in/page.tsx' 'src/app/(auth)/verify/page.tsx' scripts/auth-e2e.mjs 'src/app/(setup)/setup' src/lib/services/organizationService.ts 'src/app/(auth)/choose-organization/page.tsx' src/lib/stores/authStore.ts src/lib/stores/onboardingStore.ts src/lib/stores/organizationStore.ts src/lib/auth/organizationDestination.ts src/lib/countries.ts src/middleware.ts scripts/onboarding-e2e.mjs
      - name: Browser to API to PostgreSQL workflow (email sender fixture)
        env:
          FLEET_AUTH_BROWSER_TEST: '1'
        run: go test -tags fleet_auth_browser ./services/fleet-partner-service/internal/integration -run '^TestAuthV2BrowserWorkflow$' -count=1 -v
      - name: Full onboarding browser workflow (PostgreSQL and signed media test authority)
        env:
          FLEET_AUTH_BROWSER_TEST: '1'
        run: go test -tags fleet_auth_browser ./services/fleet-partner-service/internal/integration -run '^TestOnboardingV2BrowserWorkflow$' -count=1 -timeout 12m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-auth-v2-browser
          path: |
            .codex-cache/fleet-auth-v2-browser
            .codex-cache/fleet-onboarding-browser
          include-hidden-files: true
