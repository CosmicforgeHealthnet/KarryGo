name: Platform staging evidence (read only)
# Prints, for each selected service on the staging server: settings-file owner
# and mode (never contents), running containers with image revision, state and
# health, the recorded release image, and the latest applied migration. It
# changes nothing on the server. Same credentials and SSH pattern as
# fleet-auth-staging-evidence.yml.
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/platform-staging-evidence.yml
      - scripts/platform/staging-evidence.sh
  workflow_dispatch:
    inputs:
      services:
        description: Space-separated service keys from deploy/platform/services.tsv (empty = all)
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: platform-staging-evidence
  cancel-in-progress: false
jobs:
  evidence:
    if: github.repository == 'CosmicforgeHealthnet/KarryGo' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read runtime, settings ownership and migration heads
        shell: bash
        env:
          HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          USER_: ${{ secrets.STAGING_DEPLOY_USER }}
          KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          SERVICES: ${{ inputs.services || '' }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ && "$USER_" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SERVICES" =~ ^[a-z0-9\ -]*$ ]]
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$KEY" > "$scratch/key"
          printf '%s\n' "$KNOWN" > "$scratch/known_hosts"
          opts=(-i "$scratch/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$scratch/known_hosts" -o ConnectTimeout=12)
          remote="/tmp/karrygo-evidence-${GITHUB_RUN_ID}"
          ssh "${opts[@]}" "$USER_@$HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp "${opts[@]}" -r deploy/platform "$USER_@$HOST:$remote/platform" >/dev/null
          scp "${opts[@]}" scripts/platform/staging-evidence.sh "$USER_@$HOST:$remote/" >/dev/null
          # shellcheck disable=SC2086
          ssh "${opts[@]}" "$USER_@$HOST" "bash '$remote/staging-evidence.sh' '$remote/platform' $SERVICES; rm -rf '$remote'"
