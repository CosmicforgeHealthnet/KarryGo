name: Deploy media-file-service

on:
  push:
    branches:
      - staging
    paths:
      - 'services/media-file-service/**'
      - 'services/Dockerfile'
      - 'shared/go/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: |
          docker build -f services/Dockerfile --build-arg SERVICE_DIR=media-file-service \
            -t ghcr.io/cosmicforgehealthnet/media-file-service:latest .

      - name: Push the image
        run: docker push ghcr.io/cosmicforgehealthnet/media-file-service:latest

      - name: Deploy on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/karrygo/media-file-service
            docker compose pull
            docker compose up -d