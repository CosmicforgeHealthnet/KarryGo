name: Deploy platform (explicit approved release)
# Deliberately NO push, pull_request, workflow_call or workflow_run trigger.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current staging commit (40 lowercase hex characters)
        required: true
        type: string
      services:
        description: Explicit comma-separated service keys; all and cutovers forbidden
        required: true
        type: string
      restore_run_id:
        description: Approved successful staging restore certification run for this SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staging-release-runtime
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_SERVICES: ${{ inputs.services }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify initiator, actual protection, approval, SHA, CI and restore
        env:
          RELEASE_AUDIT_TOKEN: ${{ secrets.RELEASE_AUDIT_TOKEN }}
        run: python scripts/release/gate.py --kind platform
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build approved selection, record immutable image digests (no mutable staging tag)
        run: python scripts/release/execute.py build
      - name: Preserve authorization and image evidence BEFORE host mutation
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.run_id }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Reauthorize immediately before approved runtime operations
        env:
          RELEASE_AUDIT_TOKEN: ${{ secrets.RELEASE_AUDIT_TOKEN }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release/execute.py deploy
