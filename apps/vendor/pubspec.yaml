name: vendor
description: Karryam vendor mobile app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.3
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.3.7
  crypto: ^3.0.7
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  cosmicforge_logistics_api_core:
    path: ../../packages/api_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/onboarding/
    - assets/catalogue/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-regular.ttf
        - asset: assets/fonts/inter-bold.ttf
          weight: 700
